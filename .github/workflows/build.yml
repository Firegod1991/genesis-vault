name: Monthly build

# Builds the heavy data for Genesis and publishes it as a release:
# survival layers for the whole world, the world overview map, public domain scripture.
# The work is in scripts/. Every run, good or bad, records what happened in status.json.

on:
  schedule:
    - cron: "41 7 27 * *"   # 07:41 UTC on the 27th, ahead of the Genesis catalog refresh on the 1st
  workflow_dispatch:
    inputs:
      reuse_run:
        description: Run id to take finished survival layers from (skips the planet build)
        required: false
        default: ""
  # A build downloads the whole planet, so an edit to the workflow or the scripts does not start one.
  # To start one from a commit, change .github/rebuild.
  push:
    branches: [main]
    paths: [".github/rebuild"]

permissions:
  contents: write
  actions: read

# A newer build replaces one that is still running.
concurrency:
  group: build
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GENESIS_REPO: https://github.com/Firegod1991/genesis
  # Rehearsal: put a small OpenStreetMap extract between the first pair of quotes, for example
  # https://download.openstreetmap.fr/extracts/europe/luxembourg-latest.osm.pbf and the whole
  # workflow runs in minutes, publishes under the tag "rehearsal" and removes that release again.
  # Leave the quotes empty for the real planet build. The monthly schedule always builds the planet.
  REHEARSAL_URL: ${{ github.event_name != 'schedule' && '' || '' }}
  # Run id to take finished survival layers from, so a fix to a later step need not rebuild them.
  REUSE_RUN: ${{ github.event_name != 'schedule' && inputs.reuse_run || '' }}

jobs:
  layers:
    name: Survival layers
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vault
      - name: Free disk space and pick the roomiest disk
        id: disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          work="$RUNNER_TEMP/work"
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            work=/mnt/genesis-work
          fi
          sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          mkdir -p "$work/out" "$RUNNER_TEMP/note"
          {
            echo "WORK=$work"
            echo "OUT=$work/out"
            echo "GENESIS=$GITHUB_WORKSPACE/genesis"
            echo "GENESIS_VAULT=$work/vault"
            echo "NOTE=$RUNNER_TEMP/note/facts"
            echo "LOG=$RUNNER_TEMP/note/log"
          } >> "$GITHUB_ENV"
          df -h / /mnt 2> /dev/null || df -h /
          echo "cpus=$(nproc)" >> "$RUNNER_TEMP/note/facts"
          echo "memory_kb=$(awk '/MemTotal/ { print $2 }' /proc/meminfo)" >> "$RUNNER_TEMP/note/facts"
      - name: Reuse the layers of an earlier run
        id: reuse
        if: env.REUSE_RUN != ''
        continue-on-error: true
        run: |
          gh run download "$REUSE_RUN" --repo "$GITHUB_REPOSITORY" --name layers --dir "$OUT"
          test -s "$OUT/survival.sqlite.gz"
          test -s "$OUT/stats.json"
          echo "found=yes" >> "$GITHUB_OUTPUT"
          echo "reused_from_run=$REUSE_RUN" >> "$NOTE"
      - name: Get Genesis and the tools
        id: tools
        if: steps.reuse.outputs.found != 'yes'
        run: |
          git clone --depth 1 "$GENESIS_REPO" "$GENESIS"
          sudo apt-get update -qq
          # aria2 only makes the download faster. The build works without it.
          sudo apt-get install -y -qq osmium-tool aria2 || sudo apt-get install -y -qq osmium-tool
          osmium --version | head -1
      - name: Build the layers
        id: build
        if: steps.reuse.outputs.found != 'yes'
        run: bash vault/scripts/layers.sh 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: layers
          path: ${{ env.OUT }}
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Note how it went
        if: always()
        env:
          OUTCOMES: disk=${{ steps.disk.outcome }} reuse=${{ steps.reuse.outcome }} tools=${{ steps.tools.outcome }} build=${{ steps.build.outcome }} upload=${{ steps.upload.outcome }}
        run: python3 vault/scripts/note.py layers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: note-layers
          path: ${{ runner.temp }}/note/layers.json
          retention-days: 7
          overwrite: true

  map:
    name: World overview map
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: vault
      - name: Get Genesis
        id: tools
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/note"
          {
            echo "OUT=$RUNNER_TEMP/out"
            echo "GENESIS=$GITHUB_WORKSPACE/genesis"
            echo "GENESIS_VAULT=$RUNNER_TEMP/scratch"
            echo "NOTE=$RUNNER_TEMP/note/facts"
            echo "LOG=$RUNNER_TEMP/note/log"
          } >> "$GITHUB_ENV"
          git clone --depth 1 "$GENESIS_REPO" "$GITHUB_WORKSPACE/genesis"
      - name: Cut the map
        id: build
        run: bash vault/scripts/extras.sh map 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: map
          path: ${{ env.OUT }}/world_overview.pmtiles
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Note how it went
        if: always()
        env:
          OUTCOMES: tools=${{ steps.tools.outcome }} build=${{ steps.build.outcome }} upload=${{ steps.upload.outcome }}
        run: python3 vault/scripts/note.py map
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: note-map
          path: ${{ runner.temp }}/note/map.json
          retention-days: 7
          overwrite: true

  scripture:
    name: Public domain scripture
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: vault
      - name: Get Genesis
        id: tools
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/note"
          {
            echo "OUT=$RUNNER_TEMP/out"
            echo "GENESIS=$GITHUB_WORKSPACE/genesis"
            echo "GENESIS_VAULT=$RUNNER_TEMP/scratch"
            echo "NOTE=$RUNNER_TEMP/note/facts"
            echo "LOG=$RUNNER_TEMP/note/log"
          } >> "$GITHUB_ENV"
          git clone --depth 1 "$GENESIS_REPO" "$GITHUB_WORKSPACE/genesis"
      - name: Gather the translations
        id: build
        run: bash vault/scripts/extras.sh scripture 2>&1 | tee -a "$LOG"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: scripture
          path: |
            ${{ env.OUT }}/scripture_public_domain.zip
            ${{ env.OUT }}/scripture_count.txt
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Note how it went
        if: always()
        env:
          OUTCOMES: tools=${{ steps.tools.outcome }} build=${{ steps.build.outcome }} upload=${{ steps.upload.outcome }}
        run: python3 vault/scripts/note.py scripture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: note-scripture
          path: ${{ runner.temp }}/note/scripture.json
          retention-days: 7
          overwrite: true

  publish:
    name: Publish
    needs: [layers, map, scripture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: vault
      - name: Set folders
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/notes"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      # A part that failed has no files to fetch. The release step decides what that means.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: note-*
          path: ${{ runner.temp }}/notes
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: layers
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: map
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: scripture
          path: ${{ runner.temp }}/out
      - name: Publish the release
        id: release
        run: bash vault/scripts/release.sh 2>&1 | tee -a "$RUNNER_TEMP/notes/publish.log"
      - name: Record the build in the repository
        if: always()
        working-directory: vault
        env:
          OUTCOMES: release=${{ steps.release.outcome }}
          NEEDS: layers=${{ needs.layers.result }} map=${{ needs.map.result }} scripture=${{ needs.scripture.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Written after every run, so a failed build is visible here and not only in the Actions log.
          # The monthly commit also keeps GitHub from pausing the schedule for lack of activity.
          python3 scripts/record.py
          git config user.name "Firegod1991"
          git config user.email "193648396+Firegod1991@users.noreply.github.com"
          git add status.json
          if [ -f LATEST.md ]; then git add LATEST.md; fi
          if git diff --cached --quiet; then exit 0; fi
          if [ -n "$REHEARSAL_URL" ]; then git commit -q -m "build: rehearsal recorded"; else git commit -q -m "build: $(date -u +%Y.%m) recorded"; fi
          # Another commit may have landed while the build ran: rebase and try again.
          for _ in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
