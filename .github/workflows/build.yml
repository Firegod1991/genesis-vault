name: Monthly build

# Builds the heavy data for Genesis and publishes it as a release:
# survival layers for the whole world, the world overview map, public domain scripture.

on:
  schedule:
    - cron: "41 7 27 * *"   # 07:41 UTC on the 27th, ahead of the Genesis catalog refresh on the 1st
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  GENESIS_REPO: https://github.com/Firegod1991/genesis

jobs:
  layers:
    name: Survival layers (${{ matrix.region }})
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: [africa, antarctica, asia, australia-oceania, central-america, europe, north-america, south-america, russia]
    env:
      REGION: ${{ matrix.region }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space and pick the roomiest disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          work="$RUNNER_TEMP/work"
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            work=/mnt/genesis-work
          fi
          sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "GENESIS_VAULT=$work/vault" >> "$GITHUB_ENV"
          df -h "$work"
      - name: Get Genesis and osmium
        run: |
          git clone --depth 1 "$GENESIS_REPO" genesis
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download the extract and check it
        run: |
          url="https://download.geofabrik.de/$REGION-latest.osm.pbf"
          curl -fL --retry 5 --retry-delay 20 -C - -sS -o "$WORK/region.osm.pbf" "$url"
          want="$(curl -fsSL --retry 5 "$url.md5" | cut -d' ' -f1)"
          have="$(md5sum "$WORK/region.osm.pbf" | cut -d' ' -f1)"
          ls -l "$WORK/region.osm.pbf"
          [ "$want" = "$have" ] || { echo "MD5 mismatch: wanted $want, got $have"; exit 1; }
      - name: Keep only the survival layers
        working-directory: genesis
        run: |
          # Filtering first lets the full extract go before the next steps need the space.
          read -r -a rules <<< "$(python3 -c "from genesis import poi; print(' '.join(poi.filter_expressions()))")"
          osmium tags-filter "$WORK/region.osm.pbf" "${rules[@]}" -o "$WORK/$REGION.osm.pbf" --overwrite
          rm "$WORK/region.osm.pbf"
          ls -l "$WORK/$REGION.osm.pbf"
      - name: Build the database
        working-directory: genesis
        run: |
          python3 -m genesis fetch --id global_power_plants
          python3 -m genesis poi build --pbf "$WORK/$REGION.osm.pbf" --db "$WORK/out/$REGION.sqlite" --replace
          python3 -m genesis poi stats --db "$WORK/out/$REGION.sqlite"
      - uses: actions/upload-artifact@v7
        with:
          name: layers-${{ matrix.region }}
          path: ${{ env.WORK }}/out/${{ matrix.region }}.sqlite
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Merge and publish
    needs: layers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GENESIS_VAULT: ${{ runner.temp }}/vault
      OUT: ${{ runner.temp }}/out
      ALL_REGIONS: ${{ needs.layers.result }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          mkdir -p "$OUT"
          df -h "$RUNNER_TEMP"
      - name: Get Genesis
        run: git clone --depth 1 "$GENESIS_REPO" genesis
      - uses: actions/download-artifact@v8
        with:
          pattern: layers-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Merge the continents
        working-directory: genesis
        run: |
          shopt -s nullglob
          sources=()
          for f in "$RUNNER_TEMP"/parts/*.sqlite; do sources+=(--source "$f"); done
          [ "${#sources[@]}" -gt 0 ] || { echo "No continent was built."; exit 1; }
          python3 -m genesis poi merge --db "$OUT/survival.sqlite" "${sources[@]}"
          python3 -m genesis poi stats --db "$OUT/survival.sqlite" > "$OUT/stats.json"
          ls "$RUNNER_TEMP"/parts | sed 's/\.sqlite$//' | sort > "$OUT/regions.txt"
          rm -rf "$RUNNER_TEMP/parts"
          cat "$OUT/stats.json"
      - name: Tables for each layer
        working-directory: genesis
        run: |
          for layer in $(python3 -c "from genesis import poi; print(' '.join(poi.categories()))"); do
            python3 -m genesis poi export --db "$OUT/survival.sqlite" --format csv --cat "$layer" --out "$OUT/$layer.csv"
            gzip -9 "$OUT/$layer.csv"
          done
          gzip -6 "$OUT/survival.sqlite"
          ls -l "$OUT"
      - name: World overview map
        working-directory: genesis
        run: |
          python3 -m genesis maps world --maxzoom 6
          mv "$GENESIS_VAULT/maps/world_overview.pmtiles" "$OUT/"
      - name: Public domain scripture
        working-directory: genesis
        run: |
          ids="$(python3 -c "
          import json
          lock = json.load(open('catalog/lock/scripture.json'))['items']
          print(' '.join('--id ' + k for k, e in sorted(lock.items()) if e.get('license') == 'Public domain' and e.get('files')))
          ")"
          # One translation that will not download must not sink the whole release.
          python3 -m genesis fetch $ids --keep-going || true
          count="$(find "$GENESIS_VAULT/scripture" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "$count" > "$OUT/scripture_count.txt"
          [ "$count" -gt 50 ] || { echo "Only $count translations arrived."; exit 1; }
          (cd "$GENESIS_VAULT/scripture" && zip -q -r "$OUT/scripture_public_domain.zip" .)
      - name: Publish the release
        working-directory: ${{ runner.temp }}/out
        run: |
          tag="$(date -u +%Y.%m)"
          title="Genesis vault $(date -u +'%B %Y')"
          files=(survival.sqlite.gz world_overview.pmtiles scripture_public_domain.zip ./*.csv.gz)
          for f in "${files[@]}"; do
            [ "$(stat -c %s "$f")" -lt 2000000000 ] || { echo "$f is over the 2 GB release file limit."; exit 1; }
          done
          sha256sum "${files[@]}" | sed 's|  \./|  |' > SHA256SUMS
          python3 - > notes.md <<'EOF'
          import json, os
          stats = json.load(open("stats.json"))
          regions = open("regions.txt").read().split()
          whole = os.environ.get("ALL_REGIONS") == "success"
          print("Built %s from OpenStreetMap, continent by continent.\n" % os.popen("date -u +%Y-%m-%d").read().strip())
          if not whole:
              print("**This build is incomplete.** One or more continents failed to build. Included: %s.\n" % ", ".join(regions))
          print("| Layer | Places |\n|---|---|")
          for name, c in stats["categories"].items():
              print("| %s | %s |" % (name, format(c["total"], ",")))
          print("| **All** | **%s** |\n" % format(stats["total"], ","))
          print("%s public domain Bible translations in `scripture_public_domain.zip`.\n" % open("scripture_count.txt").read().strip())
          print("Use it with Genesis: `genesis fetch --id survival_layers_world --id world_overview`\n")
          print("Map data and survival layers: © OpenStreetMap contributors, Open Database License. "
                "Power plants: World Resources Institute Global Power Plant Database, CC BY 4.0. "
                "Scripture: public domain texts from eBible.org.")
          EOF
          cat notes.md
          # An incomplete build is published as a preview, so the last complete one stays the latest.
          if [ "$ALL_REGIONS" = "success" ]; then kind=(--prerelease=false --latest); else kind=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" SHA256SUMS --clobber
            gh release edit "$tag" --title "$title" --notes-file notes.md "${kind[@]}"
          else
            gh release create "$tag" "${files[@]}" SHA256SUMS --title "$title" --notes-file notes.md "${kind[@]}"
          fi
      - uses: actions/checkout@v7
        with:
          path: vault
      - name: Record the build in the repository
        working-directory: vault
        run: |
          # A commit each month also keeps GitHub from pausing the schedule for lack of activity.
          { echo "# Latest build"; echo; cat "$OUT/notes.md"; echo; echo "Checksums:"; echo; echo '```'; cat "$OUT/SHA256SUMS"; echo '```'; } > LATEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: $(date -u +%Y.%m)"
          git push
